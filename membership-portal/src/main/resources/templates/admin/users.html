<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Users</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>
    .pill { display:inline-flex; align-items:center; gap:.5rem; padding:.4rem .7rem; border-radius:999px; background: rgba(249,115,22,.12); color: var(--accent); border:1px solid rgba(249,115,22,.35); font-weight:700; font-size:.85rem; }
    .btn-link { background: transparent; border: none; padding: 0; color: rgba(255,255,255,0.9); cursor: pointer; font: inherit; }
    .btn-link:hover { color: var(--white); text-decoration: underline; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom: 1.25rem; }
    .page-head h1 { margin:0; font-size: 1.6rem; letter-spacing:-0.02em; }
    .meta { color: var(--text-muted); font-size: .95rem; }
    .notice { margin-top: 1rem; padding: 1rem 1.25rem; border-radius: var(--radius); border: 1px solid rgba(249,115,22,.35); background: rgba(255,237,213,.8); color: #7c2d12; }
    .table-wrap { margin-top: 1rem; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; }
    .table-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); background: linear-gradient(to right, rgba(249,115,22,.10), rgba(255,255,255,0)); }
    .table-head h2 { margin:0; font-size: 1.05rem; font-weight: 800; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: .85rem 1rem; border-bottom: 1px solid var(--border); font-size: .95rem; }
    th { text-align:left; color: var(--text-muted); font-weight: 700; background: #fff; }
    tr:hover td { background: rgba(15,23,42,.02); }
    .actions { display:flex; gap:.6rem; justify-content:flex-end; flex-wrap:wrap; }
    .btn.btn-sm { padding: .55rem 1rem; font-size: .95rem; }
    select { width: auto; min-width: 160px; }
    @media (max-width: 820px) { th:nth-child(1), td:nth-child(1) { display:none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a th:href="@{/}" class="site-logo">Fitness<span>Club</span></a>
      <nav class="site-nav">
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/enroll}" class="cta">Đăng ký gói</a>
        <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Admin</a>
        <a th:href="@{/user}" sec:authorize="hasAnyRole('USER','ADMIN')">User</a>
        <span class="pill" sec:authentication="name">admin</span>
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="display:inline;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn-link">Đăng xuất</button>
        </form>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <div class="meta"><a th:href="@{/admin}" style="color: var(--accent); text-decoration:none; font-weight:800;">← Quay lại Admin</a></div>
        <h1>Quản lý tài khoản</h1>
        <div class="meta">Xem danh sách `users` và đổi role USER/ADMIN để demo phân quyền.</div>
      </div>
    </div>

    <div class="notice" th:if="${msg != null}" th:text="${msg}"></div>

    <section class="table-wrap">
      <div class="table-head">
        <h2>Users</h2>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:80px;">ID</th>
              <th>Username</th>
              <th style="width:140px;">Role</th>
              <th style="width:320px;"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${users}">
              <td th:text="${u.id}">1</td>
              <td>
                <div style="font-weight: 800;" th:text="${u.username}">username</div>
              </td>
              <td th:text="${u.role}">USER</td>
              <td>
                <form class="actions" th:action="@{|/admin/users/${u.id}/role|}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <select name="role">
                    <option value="USER" th:selected="${u.role == 'USER'}">USER</option>
                    <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option>
                  </select>
                  <button class="btn btn-primary btn-sm" type="submit">Cập nhật role</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
              <td colspan="4" class="text-center" style="padding: 1.25rem; color: var(--text-muted);">Chưa có user nào.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; 2026 Fitness Club – Membership Portal.</div>
  </footer>
</body>
</html>
