<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng ký</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>
    .auth-shell { max-width: 600px; margin: 0 auto; }
    .auth-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); overflow: hidden; }
    .auth-hero { padding: 1.5rem 1.5rem 1.25rem; background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-card) 100%); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .auth-hero h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; color: var(--white); }
    .auth-hero p { margin: .4rem 0 0; color: rgba(255,255,255,0.78); font-size: .95rem; }
    .auth-body { padding: 1.5rem; }
    .alert { padding: .9rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 1rem; font-weight: 600; }
    .alert-danger { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
    .alert-success { background: #d1fae5; border-color: #a7f3d0; color: #065f46; }
    .row-actions { margin-top: 1.25rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .muted { color: var(--text-muted); font-size: .92rem; }
    .link { color: var(--accent); font-weight: 800; text-decoration: none; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a th:href="@{/}" class="site-logo">Fitness<span>Club</span></a>
      <nav class="site-nav">
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/enroll}" class="cta">Đăng ký gói</a>
        <a th:href="@{/login}">Đăng nhập</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-hero">
          <h1>Đăng ký tài khoản</h1>
          <p>Tạo tài khoản <b>USER</b> để xem enrollment, hợp đồng và tải PDF.</p>
        </div>

        <div class="auth-body">
          <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
          <div th:if="${success}" class="alert alert-success">
            Đăng ký thành công. Bạn có thể đăng nhập ngay.
          </div>

          <form th:action="@{/register}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label>Username</label>
            <input name="username" required placeholder="Ví dụ: you@email.com" />
            <div class="muted">Nên dùng email để tiện khớp với email khi enroll.</div>

            <label>Password</label>
            <input type="password" name="password" minlength="6" required placeholder="Tối thiểu 6 ký tự" />

            <label>Nhập lại password</label>
            <input type="password" name="confirmPassword" minlength="6" required placeholder="Nhập lại password" />

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top: 1rem;">
              Tạo tài khoản USER
            </button>
          </form>

          <div class="row-actions">
            <div class="muted">Đã có tài khoản?</div>
            <a class="link" th:href="@{/login}">Đăng nhập</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; 2026 Fitness Club – Membership Portal.</div>
  </footer>
</body>
</html>
